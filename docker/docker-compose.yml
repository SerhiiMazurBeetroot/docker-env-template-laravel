services:
  #######################################
  # Application
  #######################################
  {DOMAIN_NAME}-laravel:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
    container_name: {DOMAIN_NAME}-laravel
    env_file: .env
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: 80
    volumes:
      - ../src:/var/www/html
      - ./php.conf.ini:/usr/local/etc/php/conf.d/conf.ini
    depends_on:
      - {DOMAIN_NAME}-mysql
    restart: always

  #######################################
  # Database
  #######################################
  {DOMAIN_NAME}-mysql:
    image: mariadb:10.11
    container_name: {DOMAIN_NAME}-mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - '${PORT}:3306'
    volumes:
      - {DOMAIN_NAME}_db_data:/var/lib/mysql
    command: ['--max_allowed_packet=32505856']
    restart: always

  #######################################
  # phpMyAdmin
  #######################################
  {DOMAIN_NAME}-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: {DOMAIN_NAME}-phpmyadmin
    depends_on:
      - {DOMAIN_NAME}-mysql
    environment:
      VIRTUAL_PORT: 80
      VIRTUAL_HOST: ${PMA_VIRTUAL_HOST}
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI}
      PMA_ARBITRARY: ${PMA_ARBITRARY}
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    restart: always

  #######################################
  # Mailhog
  #######################################
  {DOMAIN_NAME}-mail:
    image: mailhog/mailhog
    container_name: {DOMAIN_NAME}-mail
    environment:
      VIRTUAL_PORT: 8025
      VIRTUAL_HOST: ${SMTP_VIRTUAL_HOST}
    restart: always

networks:
  default:
    name: dockerwp
    external: true

volumes:
  {DOMAIN_NAME}_db_data:
